# Builds the server image (with the firmware source inside) for Intel/AMD and ARM (Raspberry Pi, Apple
# Silicon, Home Assistant boxes) and publishes it to ghcr.io/<owner>/espectacle.
#   push to main   -> :latest
#   tag v1.14.0    -> :1.14.0 and :1.14 (the Home Assistant add-on pulls :<version>)
name: Docker image

on:
  push:
    branches: [main]
    paths: [server/**, firmware/**, Dockerfile, .dockerignore, .github/workflows/docker.yml]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
