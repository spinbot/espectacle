; ESPectacle firmware - ESP32-S2, ESP32-S3 and the original ESP32
; Build/flash:  pio run -e lolin_s2_mini -t upload      (ESP32-S2)
;               pio run -e esp32-s3-n8r2 -t upload      (ESP32-S3, 8 MB flash / 2 MB PSRAM)
[platformio]
default_envs = lolin_s2_mini

[env]
platform = espressif32@6.9.0
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
lib_deps =
    adafruit/Adafruit NeoPixel@^1.12.3
    bblanchon/ArduinoJson@^7.2.0
build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DARDUINOJSON_USE_LONG_LONG=1
; Names the board in the firmware (for over-the-air updates) and, after each build, copies the .bin into
; ../server/data/firmware so the ESPectacle server can offer it (see tools/espectacle_build.py).
extra_scripts = pre:tools/espectacle_build.py

; Wemos/Lolin S2 Mini (native USB). Hold button 0, tap RST to enter the bootloader.
[env:lolin_s2_mini]
board = lolin_s2_mini
build_flags =
    ${env.build_flags}
    -DDEFAULT_LED_PIN=16

; Espressif ESP32-S2-Saola-1 / generic ESP32-S2 dev boards (USB-UART bridge)
[env:esp32-s2-saola-1]
board = esp32-s2-saola-1
build_flags =
    ${env.build_flags}
    -DDEFAULT_LED_PIN=16

; ESP32-S3 DevKitC-1 style boards with 8 MB flash and 2 MB (quad) PSRAM - "N8R2".
; Two USB-C ports: flash through the one marked UART/COM (no button presses needed).
[env:esp32-s3-n8r2]
board = esp32-s3-devkitc-1
board_upload.flash_size = 8MB
board_build.partitions = default_8MB.csv
board_build.arduino.memory_type = qio_qspi
build_flags =
    ${env.build_flags}
    -DBOARD_HAS_PSRAM
    -DDEFAULT_LED_PIN=16

; ESP32-S3 boards with 16 MB flash and 8 MB (octal) PSRAM - "N16R8".
; Octal PSRAM uses GPIO 35-37, so those pins are not offered for LEDs.
[env:esp32-s3-n16r8]
board = esp32-s3-devkitc-1
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.arduino.memory_type = qio_opi
build_flags =
    ${env.build_flags}
    -DBOARD_HAS_PSRAM
    -DESPECTACLE_OCTAL_PSRAM=1
    -DDEFAULT_LED_PIN=16

; ESP32 DevKit / NodeMCU-32S style boards with an ESP32-WROOM-32 (4 MB flash, USB-serial chip).
; Hold BOOT while flashing if the upload doesn't start on its own.
[env:esp32dev]
board = esp32dev
build_flags =
    ${env.build_flags}
    -DDEFAULT_LED_PIN=16
